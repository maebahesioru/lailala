# deploy-cache-bust: 2026-10-29 (Coolify の compose 読み取りキャッシュ回避)
version: "3.8"

services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lailala?schema=public&connection_limit=20&pool_timeout=20
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TREND_VIDEO_IDS=${TREND_VIDEO_IDS:-niKAylKNIEI}
      - UPLOAD_DIR=/app/uploads
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - 'uploads:/app/uploads'
    depends_on:
      - db
    # ログは溜め込まない（既定の json-file は無制限に増える）。
    # アクセスログはアプリ側で一切出力していないので、残るのは起動・ワーカーの記録だけ。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lailala
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  postgres_data:
  uploads:
